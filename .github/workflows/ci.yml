name: ci

# Note: swift-spm-lab/ (the Swift Package Manager recovery lab) is NOT covered by this workflow.
# It needs macOS with Xcode and has only ever run locally (see swift-spm-lab/README.md). A macOS job
# for it would be `runs-on: macos-latest` plus `bash swift-spm-lab/verify.sh --no-record`; that job has
# not been added and has never run, and the runner's Xcode would change some of the tool texts the lab
# compares against, so it would need a first run and a review before anyone relies on it.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm run typecheck
      - run: npm test
      - run: npm run mutation-check -- --validate
      - run: npm run mutation-check -- --self-test
